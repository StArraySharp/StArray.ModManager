name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  # ──── Android AAR ────
  android:
    name: Android AAR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 ndk;27.2.12479018 build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build AAR
        working-directory: Android
        run: |
          chmod +x gradlew
          ./gradlew :library:assembleRelease

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: library-release.aar
          path: Android/library/build/outputs/aar/library-release.aar

  # ──── Windows Native + .NET DLL (cross-compiled on Linux) ────
  windows:
    name: Windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install MinGW cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-mingw-w64-x86-64 \
            g++-mingw-w64-x86-64 \
            mingw-w64-tools \
            cmake \
            ninja-build

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build Native (CMake + MinGW cross)
        run: |
          cd StArray.ModManager.Windows/Native
          # Generate cimgui import lib from pre-built DLL
          x86_64-w64-mingw32-gendef - ../dlls/cimgui.dll > cimgui.def
          x86_64-w64-mingw32-dlltool -d cimgui.def -l libcimgui.a -D ../dlls/cimgui.dll
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc \
            -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++ \
            -DCMAKE_RC_COMPILER=x86_64-w64-mingw32-windres
          cmake --build build

      - name: Build C#
        run: dotnet build StArray.ModManager.Windows/StArray.ModManager.Windows.csproj -c Release -p:BuildNativeDll=false

      - name: Package
        run: |
          src="StArray.ModManager.Windows/bin/Release/net10.0"
          dst="artifacts"
          mkdir -p "$dst"
          cp -r "$src"/* "$dst/"
          rm -rf "$dst/runtimes"
          cd "$dst" && zip -r ../windows-dll.zip . && cd ..

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: windows-dll
          path: windows-dll.zip

  # ──── Android .NET DLL ────
  android-dll:
    name: Android DLL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build Android
        run: dotnet build StArray.ModManager.Android/StArray.ModManager.Android.csproj -c Release

      - name: Package output (exclude runtimes)
        run: |
          src="StArray.ModManager.Android/bin/Release/net10.0"
          dst="artifacts"
          mkdir -p "$dst"
          cp -r "$src"/* "$dst/"
          rm -rf "$dst/runtimes"
          cd "$dst" && zip -r ../android-dll.zip . && cd ..

      - name: Upload Android DLL
        uses: actions/upload-artifact@v4
        with:
          name: android-dll.zip
          path: android-dll.zip
